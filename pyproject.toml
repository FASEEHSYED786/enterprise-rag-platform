[project]
name = "enterprise-rag-platform"
version = "1.0.0"
description = "Multi-tenant enterprise RAG platform: ingestion, hybrid search, guardrails, streaming API, observability"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]
